<style>
  /* Hero banner sizing and palette driven by theme vars */
  :root {
    --hb-nav-h: 64px;
    --hb-bg-1: var(--global-bg-color);
    --hb-bg-2: var(--global-bg-secondary-color);
    --hb-glow-1: color-mix(in srgb, var(--global-theme-color) 40%, transparent);
    --hb-glow-2: color-mix(in srgb, var(--global-secondary-theme-color, var(--global-theme-color)) 30%, transparent);
    --hb-overlay: linear-gradient(180deg, rgba(0,0,0,0.08) 0%, rgba(0,0,0,0.12) 100%);
    --hero-grid-color: rgba(128, 128, 128, 0.18);
  }

  html[data-theme="dark"] {
    --hero-grid-color: rgba(128, 128, 128, 0.18);
  }

  .hb-hero {
    position: relative;
    min-height: 100vh;
    background: var(--hb-bg-1);
    color: var(--global-text-color);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: calc(-3 * var(--hb-nav-h));
    padding-top: calc(var(--hb-nav-h));
    padding-bottom: 0;
  }

  .hb-hero h1 { letter-spacing: -0.03em; }
  .hb-hero h1,
  .hb-hero-lead,
  .hb-hero p {
    font-family: var(--font-family-heading, var(--font-family-body, inherit));
  }
  .hb-hero .hero-content {
    background: transparent;
    border: none;
    border-radius: 0;
    padding: 0;
    box-shadow: none;
  }
  .hb-hero-lead {
    max-width: 48ch;
    font-size: clamp(1.8rem, 4vw, 2.6rem);
    line-height: 1.4;
    text-shadow: 0 2px 8px rgba(0,0,0,0.25);
  }

  .hb-hero-glow {
    pointer-events: none;
    background: radial-gradient(circle at 30% 40%, var(--hb-glow-1), transparent 45%),
                radial-gradient(circle at 70% 60%, var(--hb-glow-2), transparent 40%);
    mix-blend-mode: screen;
    opacity: 0.9;
  }

  [data-typer] {
    visibility: hidden;
    display: block;
    white-space: normal;
    word-break: normal;
    overflow-wrap: normal;
  }
  [data-typer] .hb-typer-word { white-space: nowrap; }
  [data-typer] .hb-typer-letter {
    opacity: 0;
    display: inline-block;
    animation: hb-fade-in 1.2s forwards;
  }
  @keyframes hb-fade-in { to { opacity: 1; } }

  /* tighten gap into the next section */
  .resume-biography {
    padding-top: clamp(1rem, 2vw, 2rem) !important;
    margin-top: 0 !important;
  }

  /* Hero canvas and mask alignment */
  #hb-hero-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
  }

  .hb-hero::before {
    display: none;
  }

  .hb-hero > * { position: relative; z-index: 2; }

  /* Stats row in bio text */
  .stats-row {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    gap: 1rem;
    padding: 1.25rem 1.5rem;
    margin-top: 1.5rem;
    border: 1px solid var(--global-divider-color);
    border-radius: 16px;
    background: color-mix(in srgb, var(--global-bg-secondary-color) 70%, transparent);
  }
  .stats-row > div {
    flex: 1 1 10rem;
    min-width: 9rem;
    text-align: center;
  }
  .stats-row b {
    display: block;
    font-size: clamp(1.75rem, 3vw, 2.25rem);
    color: var(--global-theme-color);
    margin-bottom: 0.3rem;
  }
  .stats-row span {
    display: block;
    font-size: 0.95rem;
    color: var(--global-text-color);
    opacity: 0.9;
  }

  /* Activities list styled similar to news */
  .activities-list {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 1rem;
    margin-top: 1rem;
  }
  .activity-item {
    border: 1px solid var(--global-divider-color);
    border-radius: 14px;
    padding: 1rem 1.1rem;
    background: color-mix(in srgb, var(--global-bg-secondary-color) 70%, transparent);
    box-shadow: 0 6px 18px rgba(0,0,0,0.08);
  }
  .activity-badge {
    display: inline-block;
    padding: 0.25rem 0.6rem;
    border-radius: 999px;
    font-size: 0.8rem;
    font-weight: 700;
    background: var(--global-theme-color);
    color: #fff;
    margin-bottom: 0.35rem;
  }
  .activity-badge.talk {
    background: var(--global-secondary-theme-color, var(--global-theme-color));
  }
  .activity-meta {
    font-size: 0.9rem;
    color: var(--global-text-color);
    opacity: 0.8;
    margin-bottom: 0.2rem;
  }
  .activity-title {
    font-size: 1rem;
    font-weight: 600;
    color: var(--global-text-color);
    line-height: 1.4;
  }
</style>

<link rel="preload" as="script" href="/js/hero.js">
<script src="/js/hero.js" defer></script>
